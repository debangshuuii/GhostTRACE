version: "3.8"

services:
  ghosttrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghosttrace-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - PORT=3000
    volumes:
      - ghosttrace-data:/app/prisma

volumes:
  ghosttrace-data:
    driver: local
